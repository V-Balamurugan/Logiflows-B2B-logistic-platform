openapi: 3.0.3
info:
  title: LogiFlows API Gateway
  description: Authoritative REST API for LogiFlows Smart Postal & Courier Delivery Management System
  version: 0.1.0-auth-rbac
servers:
  - url: /api/v1
    description: Current Server
  - url: http://localhost:8080/api/v1
    description: Local Development Server

tags:
  - name: System Health
    description: Liveness, readiness, and connectivity diagnostics
  - name: Authentication
    description: Authoritative user registration, login, token rotation, and identity claims
  - name: RBAC & Tenant Verification
    description: Endpoints demonstrating role-based access control and tenant isolation

paths:
  /healthz:
    get:
      tags:
        - System Health
      summary: Liveness Probe
      description: Returns service status, version, uptime, and timestamp
      responses:
        '200':
          description: Service is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      tags:
        - System Health
      summary: Readiness Probe
      description: Checks PostgreSQL database and Redis connectivity
      responses:
        '200':
          description: All dependencies are healthy
        '503':
          description: One or more dependencies are degraded

  /ping:
    get:
      tags:
        - System Health
      summary: Gateway Ping
      description: Returns simple pong verification message
      responses:
        '200':
          description: Pong response

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register Customer or Tenant
      description: Creates a new user account with role CUSTOMER or TENANT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name, role]
              properties:
                email:
                  type: string
                  example: newuser@example.com
                password:
                  type: string
                  example: SecurePass123!
                first_name:
                  type: string
                  example: Alex
                last_name:
                  type: string
                  example: Smith
                phone:
                  type: string
                  example: "+1234567890"
                role:
                  type: string
                  enum: [CUSTOMER, TENANT]
                  example: CUSTOMER
                company_name:
                  type: string
                  example: Acme Corp
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request or weak password
        '409':
          description: Email already registered

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate User
      description: Authenticates user credentials and returns signed JWT access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: admin@logiflows.io
                password:
                  type: string
                  example: Admin@LogiFlows2026!
      responses:
        '200':
          description: Successful authentication with tokens and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
        '403':
          description: Account inactive

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate Access & Refresh Tokens
      description: Issues a new JWT access token using a valid refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Token expired or revoked

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke Refresh Token
      description: Invalidates active refresh token session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Current Authenticated User Profile
      description: Returns identity claims, authoritative role, and permissions for current session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile, authoritative role, and permissions returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Missing or invalid token

  /admin/system-check:
    get:
      tags:
        - RBAC & Tenant Verification
      summary: Platform Admin System Check
      description: Verified endpoint restricted strictly to PLATFORM_ADMIN role
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Platform admin access granted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Insufficient role permissions

  /parcels/permission-check:
    get:
      tags:
        - RBAC & Tenant Verification
      summary: Parcel Create Permission Check
      description: Endpoint requiring specific parcel.create permission
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User has parcel.create permission
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Lacks required permission

  /tenants/{tenant_id}/boundary-check:
    get:
      tags:
        - RBAC & Tenant Verification
      summary: Tenant Isolation Boundary Check
      description: Verifies cross-tenant isolation and prevents IDOR leaks
      security:
        - BearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: UUID of the target tenant
          schema:
            type: string
            format: uuid
            example: "00000000-0000-0000-0000-000000000001"
      responses:
        '200':
          description: Tenant boundary access verified
        '401':
          description: Unauthorized
        '403':
          description: Cross-tenant access forbidden

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT access token obtained from /api/v1/auth/login

  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: OK
            version:
              type: string
              example: 0.1.0-auth-rbac
            uptime_seconds:
              type: integer
              example: 120
            timestamp:
              type: string
              format: date-time
        request_id:
          type: string

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            tokens:
              $ref: '#/components/schemas/TokenPair'
            permissions:
              type: array
              items:
                type: string
        request_id:
          type: string

    UserProfileResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            permissions:
              type: array
              items:
                type: string
        request_id:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [PLATFORM_ADMIN, TENANT, TENANT_ADMIN, EMPLOYEE, CUSTOMER]
        is_active:
          type: boolean
        tenant_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
        token_type:
          type: string
          example: Bearer
