services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: logiflows-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logiflows}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logiflows_secret}
      POSTGRES_DB: ${POSTGRES_DB:-logiflows}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logiflows} -d ${POSTGRES_DB:-logiflows}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logiflows-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logiflows-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DATABASE_URL: postgres://logiflows:logiflows_secret@postgres:5432/logiflows?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET:-replace_with_super_secret_jwt_key_at_least_32_characters_long}
      JWT_ISSUER: logiflows-auth-service
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: logiflows-ai
    restart: unless-stopped
    environment:
      APP_PORT: 8000
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: logiflows-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: logiflows-mobile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"

volumes:
  postgres_data:
  redis_data:
