openapi: 3.0.3
info:
  title: LogiFlows API Gateway
  description: Authoritative REST API for LogiFlows Smart Postal & Courier Delivery Management System
  version: 0.0.1-foundation
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

paths:
  /healthz:
    get:
      summary: Liveness Probe
      description: Returns process liveness and uptime metrics
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /readyz:
    get:
      summary: Readiness Probe
      description: Evaluates operational readiness of critical infrastructure dependencies
      responses:
        '200':
          description: All critical dependencies are operational
        '503':
          description: Service is degraded or dependencies unavailable

  /ping:
    get:
      summary: Ping Gateway
      responses:
        '200':
          description: Successful ping response

components:
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        data:
          type: object
        meta:
          type: object
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
