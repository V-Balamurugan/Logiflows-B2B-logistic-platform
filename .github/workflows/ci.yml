name: LogiFlows Continuous Integration

on:
  push:
    branches: [ main, develop, 'phase/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend (Go) Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Verify Formatting
        run: |
          cd backend
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run gofmt -w ."
            exit 1
          fi

      - name: Run Backend Unit Tests
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.out ./...

  web-ci:
    name: Web Frontend (React/TS/Vite) Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web Bundle
        run: |
          cd web
          npm run build

  ai-ci:
    name: AI Advisory Service (Python/FastAPI) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai/requirements.txt

      - name: Install Dependencies
        run: |
          cd ai
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Tests
        run: |
          cd ai
          pytest -v tests/

  mobile-ci:
    name: Mobile Operations Client (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd mobile
          flutter analyze

      - name: Run Flutter Widget Tests
        run: |
          cd mobile
          flutter test
